set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

set -g default-terminal tmux-256color
set -s terminal-features[100] 'xterm-256color:RGB'
set -s terminal-features[101] 'ms-terminal:256:RGB'
set -s terminal-features[102] 'xterm-ghostty:256:RGB'
set -s terminal-features[103] 'ghostty:256:RGB'
set -s terminal-features[104] 'nsterm-256color:256:RGB'

# set colors at startup, assume no terminal = truecolor
if -F '#{==:#{@shell-palette},}' {
    set -gF @shell-palette '#{s/ .*//:#{L:#{?client_tty,#{?#{||:#{m:*RGB*,#{client_termfeatures}},#{||:#{m/r:^(truecolor|24bit)$,#{COLORTERM}},#{m/r:^(xterm-256color|ms-terminal|xterm-ghostty|ghostty|nsterm-256color)$,#{client_termname}}}},truecolor,#{?#{||:#{m:*256*,#{client_termfeatures}},#{m:*256color,#{client_termname}}},256,ansi}},truecolor} }}'
    if -F '#{==:#{@shell-palette},}' { set -g @shell-palette truecolor }
    set-environment -gF DOTFILES_TMUX_COLORS '#{@shell-palette}'
    set-environment -gF COLORTERM '#{?#{==:#{@shell-palette},truecolor},truecolor,}'
}

set -s extended-keys always
set -sq extended-keys-format csi-u  # 3.5+
set -s focus-events on
set -s escape-time 50

# 'external' to limit this to tmux itself
set -s set-clipboard on

set -wg automatic-rename off
set -g allow-rename on
set -g set-titles on
# try to block tmux from parsing a Kitty graphics query (eg claude code) as a title
set -g set-titles-string '#{?#{m/r:^G([A-Za-z]=[^#,;]+#,)*a=q(#,[A-Za-z]=[^#,;]+)*(;|$),#{pane_title}},#{window_name},#{pane_title}}'

# use screen-style C-a prefix
unbind C-b
set -g prefix C-a
bind a send-prefix
bind C-a last-window
bind = list-clients
bind v set -g status
bind C-v set -g status
bind O customize-mode -Z
bind R source-file ~/.tmux.conf
bind M set -g mouse

# Create ordinary windows at the end. Uppercase C and splits keep the pane's directory
bind c new-window
bind C-c new-window
bind C new-window -ac '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind C-d detach-client
bind C-l refresh-client
bind C-n next-window
bind C-p previous-window
bind m command-prompt -p 'Swap current window with:' { swap-window -t '%%' }
bind o command-prompt -p 'Rename current window:' {
    set -w @rename-input '%%'
    rename-window -- '#{@rename-input}'
    set -wu @rename-input
}
bind r respawn-window
bind x choose-tree -w 'kill-window -t "%%%"'

# C-a 0 selects window 10. C-a shift-1..shift-0 selects windows 11-20
bind 0 select-window -t 10
bind ! select-window -t 11
bind @ select-window -t 12
bind '#' select-window -t 13
bind '$' select-window -t 14
bind % select-window -t 15
bind ^ select-window -t 16
bind & select-window -t 17
bind '*' select-window -t 18
bind '(' select-window -t 19
bind ')' select-window -t 20

set -wg mode-keys vi
if -F '#{==:#{@nerd-font},}' { set -g @nerd-font auto }
set -g @shade-glyphs '#{?#{==:#{@nerd-font},auto},#{==:#{@shell-palette},truecolor},#{==:#{@nerd-font},1}}'

set -g @ui-base '#131d2d'
set -g @ui-surface '#182437'
set -g @ui-stripe '#222e42'
set -g @ui-active '#31486d'
set -g @ui-accent '#fda293'
set -g @ui-blue '#8cb2f1'
if -F '#{==:#{@shell-palette},256}' {
    set -g @ui-base colour234
    set -g @ui-surface colour235
    set -g @ui-stripe colour236
    set -g @ui-active colour24
    set -g @ui-accent colour216
    set -g @ui-blue colour111
}
if -F '#{==:#{@shell-palette},ansi}' {
    set -g @ui-base black
    set -g @ui-surface black
    set -g @ui-stripe black
    set -g @ui-active white
    set -g @ui-accent cyan
    set -g @ui-blue cyan
}
set -gF @ui-active-fg '#{?#{==:#{@shell-palette},ansi},black,terminal}'
set -gF @ui-active-accent '#{?#{==:#{@shell-palette},ansi},black,#{@ui-accent}}'
set -gF @ui-separator '#{?#{==:#{@shell-palette},ansi},brightred,#{@ui-accent}}'
set -gF @ui-border '#{?#{==:#{@shell-palette},ansi},blue,#{@ui-surface}}'
set -gF @ui-message-bg '#{?#{==:#{@shell-palette},ansi},yellow,#{@ui-accent}}'

set -gF status-style 'bg=#{@ui-base} fg=terminal'
set -gF pane-active-border-style 'fg=#{@ui-accent}'
set -gF pane-border-style 'fg=#{@ui-border}'
set -gF message-style 'bg=#{@ui-message-bg} fg=#{@ui-base} fill=#{@ui-message-bg} nobold'
set -gF message-command-style '#{message-style}'

set -wgF mode-style 'bg=#{@ui-active} fg=#{@ui-active-fg}'
set -wgqF copy-mode-selection-style '#{mode-style}'
set -wgF copy-mode-match-style '#{mode-style}'
set -wgF copy-mode-current-match-style '#{mode-style} bold underscore'
set -wgF copy-mode-mark-style '#{mode-style} underscore'
set -wgqF copy-mode-position-style 'bg=#{@ui-message-bg} fg=#{@ui-base} bold'
set -gF display-panes-active-colour '#{@ui-accent}'
set -gF display-panes-colour '#{@ui-blue}'

set -wgF popup-style 'bg=#{@ui-surface} fg=terminal'
set -wgF popup-border-style 'bg=#{@ui-surface} fg=#{@ui-blue}'

# silence errors for options missing in older versions
set -wgqF menu-style '#{popup-style}'
set -wgqF menu-selected-style 'bg=#{@ui-active} fg=#{@ui-active-fg} bold'
set -wgqF menu-border-style '#{popup-border-style}'
set -wgqF tree-mode-border-style '#{popup-border-style}'
set -wgq tree-mode-preview-style 'fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@ui-accent},#{@ui-blue}}'
set -wgqF display-panes-border-style '#{popup-border-style}'

# prioritize flags: bell, activity, silence, marked, modal, zoom
set -g @window-flags '#{?window_bell_flag,#{?#{E:@shade-glyphs}, ,!},#{?window_activity_flag,#{?#{E:@shade-glyphs}, ,##},#{?window_silence_flag,#{?#{E:@shade-glyphs}, ,~},#{?window_marked_flag,#{?#{E:@shade-glyphs}, ,M},#{?window_modal_pane,#{?#{E:@shade-glyphs},▣ ,O},#{?window_zoomed_flag,#{?#{E:@shade-glyphs}, ,Z},}}}}}}'

# use window-list position if available, else fall back to window index
# use the m alias for modulo so strftime cannot consume the operator on macos
set -g @shade-striped '#{?#{==:#{loop_index},},#{e|m:#{window_index},2},#{m:*[02468],#{loop_index}}}'
set -g @shade-bg '#{?window_active,#{@ui-active},#{?#{E:@shade-striped},#{@ui-stripe},#{@ui-surface}}}'
# Keep the tab foreground explicit across transitions from the cap to the label.
set -g @shade-fg '#{?#{==:#{@shell-palette},ansi},#{?window_active,black,terminal},white}'
set -g @shade-neighbour-bg '#{?#{E:@shade-striped},#{@ui-surface},#{@ui-stripe}}'
# Each cap paints its window color over the adjacent segment or the status background.
set -g @shade-leading '#{?#{&&:#{E:@shade-glyphs},#{e|<=:#{window_index},#{active_window_index}}},#[none fg=#{E:@shade-bg} bg=#{?window_start_flag,#{@ui-base},#{E:@shade-neighbour-bg}}],}'
set -g @shade-trailing '#{?#{&&:#{E:@shade-glyphs},#{e|>=:#{window_index},#{active_window_index}}},#[none fg=#{E:@shade-bg} bg=#{?window_end_flag,#{@ui-base},#{E:@shade-neighbour-bg}}],}'
set -g @shade-name '#{?#{e|>:#{n:window_name},50},#{?#{E:@shade-glyphs},#{=/49/…;q/h:window_name},#{=/47/...;q/h:window_name}},#{q/h:window_name}}'
set -g @shade-window '#[range=window|#{window_index} none]#{?window_active,#[list=focus],}#{E:@shade-leading}#[fg=#{E:@shade-fg} bg=#{E:@shade-bg} #{?window_active,bold,nobold}] #[fg=#{?window_active,#{@ui-active-accent},#{E:@shade-fg}}]#{E:@window-flags}#{window_index}:#[fg=#{E:@shade-fg}]#{E:@shade-name} #{E:@shade-trailing}#[norange list=on default]'
set -g @shade-left '#[align=left range=left fg=terminal bg=#{@ui-base} bold] #{=20;q/h:host_short}#{?#{==:#{session_name},main},,#[fg=terminal nobold]:#{=20;q/h:session_name}} #[fg=#{@ui-separator} nobold]#{?#{E:@shade-glyphs},│,|} #[norange default]'
set -g status-format[0] '#{E:@shade-left}#[list=on align=left]#[list=left-marker fg=terminal bg=#{@ui-surface}]#{?#{E:@shade-glyphs},…,<}#[list=right-marker fg=terminal bg=#{@ui-surface}]#{?#{E:@shade-glyphs},…,>}#[list=on default]#{W:#{E:@shade-window}}#[nolist default]'

source-file -q ~/.tmux.conf.local
