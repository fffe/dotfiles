# ANSI fallback: retain semantic colors without assuming a terminal palette.
[color "diff"]
	old = "red"
	new = "green"
	meta = "cyan"
	frag = "yellow"
	commit = "cyan"
	whitespace = "black yellow"
[color "status"]
	added = "green"
	changed = "cyan"
	untracked = "yellow"
	unmerged = "black yellow"
	branch = "cyan"
	localBranch = "cyan"
	remoteBranch = "cyan"
	noBranch = "yellow"
[color "branch"]
	current = "cyan bold"
	remote = "cyan"
	upstream = "cyan"
	worktree = "cyan"
[color "decorate"]
	HEAD = "cyan bold"
	branch = "cyan"
	remoteBranch = "cyan"
	tag = "cyan"
	stash = "yellow"
	grafted = "yellow"
[color "grep"]
	filename = "cyan"
	match = "black cyan"
	lineNumber = "normal"
	column = "normal"
	separator = "normal"
[color "interactive"]
	prompt = "cyan"
	header = "cyan"
	help = "normal"
	error = "red"
[color "advice"]
	hint = "cyan"
