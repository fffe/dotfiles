# Catppuccin Mocha; 256-color values follow catppuccin/vim.
[color "diff"]
	old = "211"
	new = "114"
	meta = "111"
	frag = "216"
	commit = "111"
	whitespace = "232 211"
[color "status"]
	added = "114"
	changed = "111"
	untracked = "222"
	unmerged = "232 211"
	branch = "111"
	localBranch = "111"
	remoteBranch = "183"
	noBranch = "216"
[color "branch"]
	current = "111 bold"
	remote = "183"
	upstream = "111"
	worktree = "158"
[color "decorate"]
	HEAD = "111 bold"
	branch = "111"
	remoteBranch = "183"
	tag = "111"
	stash = "216"
	grafted = "216"
[color "grep"]
	filename = "111"
	match = "232 158"
	lineNumber = "normal"
	column = "normal"
	separator = "normal"
[color "interactive"]
	prompt = "111"
	header = "111"
	help = "normal"
	error = "211"
[color "advice"]
	hint = "111"
