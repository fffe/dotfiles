# Catppuccin Mocha.
[color "diff"]
	old = "#f38ba8"
	new = "#a6e3a1"
	meta = "#89b4fa"
	frag = "#fab387"
	commit = "#89b4fa"
	whitespace = "#0c0c0c #f38ba8"
[color "status"]
	added = "#a6e3a1"
	changed = "#89b4fa"
	untracked = "#f9e2af"
	unmerged = "#0c0c0c #f38ba8"
	branch = "#89b4fa"
	localBranch = "#89b4fa"
	remoteBranch = "#cba6f7"
	noBranch = "#fab387"
[color "branch"]
	current = "#89b4fa bold"
	remote = "#cba6f7"
	upstream = "#89b4fa"
	worktree = "#94e2d5"
[color "decorate"]
	HEAD = "#89b4fa bold"
	branch = "#89b4fa"
	remoteBranch = "#cba6f7"
	tag = "#89b4fa"
	stash = "#fab387"
	grafted = "#fab387"
[color "grep"]
	filename = "#89b4fa"
	match = "#0c0c0c #94e2d5"
	lineNumber = "normal"
	column = "normal"
	separator = "normal"
[color "interactive"]
	prompt = "#89b4fa"
	header = "#89b4fa"
	help = "normal"
	error = "#f38ba8"
[color "advice"]
	hint = "#89b4fa"
